name: Dual-scale CSharp core
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    paths: ['unity/Packages/**', 'validation/**', '.github/workflows/dual-scale-core.yml']
  pull_request:
    paths: ['unity/Packages/**', 'validation/**', '.github/workflows/dual-scale-core.yml']
permissions:
  contents: read
concurrency:
  group: dual-scale-${{ github.ref }}
  cancel-in-progress: true
jobs:
  csharp-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record available SDKs and runtimes
        run: |
          dotnet --list-sdks
          dotnet --list-runtimes
      - name: Compile core and run every behavioral suite
        run: |
          set -euo pipefail
          for project in validation/RoomBreakers.*.Tests/*.csproj; do
            dotnet run --project "$project" --configuration Release
          done
      - name: State validation boundary
        if: always()
        run: echo 'Actual CSharp core with synthetic rooms/input. NOT Unity import, Meta SDK compilation, APK, sensors or Quest performance.'
